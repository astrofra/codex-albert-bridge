name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Windows installation without API credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_HOME: ${{ runner.temp }}/bridge-codex-home
        run: |
          ./install.ps1 -PythonExecutable (Get-Command python).Source -InstallDir "$env:RUNNER_TEMP/bridge-install" -SkipConfigure -NoPath
          & "$env:RUNNER_TEMP/bridge-install/venv/Scripts/codex-albert.exe" doctor
          if ($LASTEXITCODE) { throw 'Doctor failed' }
